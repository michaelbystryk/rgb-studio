name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or
            (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup -y --no-progress }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build the zip and installer
        run: node tools/build-release.js

      - name: Upload to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "RGB Studio ${GITHUB_REF_NAME#v}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/RGBStudioSetup-*.exe --clobber

      - name: Keep the files from a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: rgb-studio-release
          path: |
            dist/*.zip
            dist/RGBStudioSetup-*.exe
